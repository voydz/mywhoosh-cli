name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - name: Test
        run: go test ./... -v
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build and smoke
        run: |
          mkdir -p dist
          go build -trimpath -o dist/mywhoosh ./cmd/mywhoosh
          dist/mywhoosh --help
          dist/mywhoosh version
      - name: Cross-build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/mywhoosh-linux-arm64 ./cmd/mywhoosh
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/mywhoosh-darwin-arm64 ./cmd/mywhoosh
      - name: Check formatting
        if: always()
        shell: bash
        run: |
          gofmt -w cmd internal 2>/dev/null || gofmt -w internal
          git diff --exit-code > formatting.patch
          rm formatting.patch
      - name: Formatting patch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: formatting-${{ matrix.os }}
          path: formatting.patch
          if-no-files-found: ignore
